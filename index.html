<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F40009" />
    <title>Volta do Vitu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F40009'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-family='Georgia'%3EV%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <p class="brand">Coca-Cola</p>
      <p class="now"><span id="nowDate"></span><br /><span id="nowTime"></span></p>
    </header>

    <main>
      <div class="hero">
        <img class="bottle" src="bottle.png" alt="Garrafa de vidro da Coca-Cola" />

        <section class="calendar" aria-labelledby="calHead">
          <div class="rings" aria-hidden="true"><span></span><span></span></div>
          <p class="cal-head" id="calHead">Faltam</p>
          <div class="countdown">
            <p class="unit"><span class="num" id="days">00</span><span class="lbl">dias</span></p>
            <p class="colon" aria-hidden="true">:</p>
            <p class="unit"><span class="num" id="hours">00</span><span class="lbl">horas</span></p>
            <p class="colon" aria-hidden="true">:</p>
            <p class="unit"><span class="num" id="minutes">00</span><span class="lbl">minutos</span></p>
            <p class="colon" aria-hidden="true">:</p>
            <p class="unit"><span class="num" id="seconds">00</span><span class="lbl">segundos</span></p>
          </div>
          <p class="cal-foot" id="calFoot">para o Vitu voltar para a gente</p>
          <p class="return-date">Segunda-feira, 9 de novembro de 2026, 8h</p>
          <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Quanto das férias já passou">
            <div class="bar" id="bar"></div>
          </div>
          <p class="progress-lbl" id="progressLbl"></p>
        </section>
      </div>
      <p class="phrase" id="phrase"></p>
      <p class="credit">Foto da garrafa: Hariadi e Bruce The Deus, Wikimedia Commons, CC BY-SA 3.0.</p>
      <p class="live" id="live" aria-live="polite"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
