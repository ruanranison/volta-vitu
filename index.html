<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E10600" />
    <title>Volta do Vitu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500&family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23E10600'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='white' font-size='14' font-family='sans-serif'%3EV%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="bar">
      <p class="mark">Solar</p>
      <p class="note">Homenagem interna. Não é o site da marca.</p>
    </header>
    <main>
      <p class="count" id="count" aria-live="polite">23</p>
      <h1 id="headline">Faltam 23 dias para o Vitu voltar</h1>
      <p class="who">Vitor Wallaf, o trabalhador mais assíduo</p>
      <p class="phrase" id="phrase"></p>
      <ol class="track" id="track" aria-label="Dias de férias já corridos"></ol>
    </main>
    <footer>
      <p>Volta marcada para 8 de novembro de 2026.</p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
