<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F40009" />
    <title>Volta do Vitu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Lobster&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F40009'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-family='Georgia'%3EV%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="stage">
      <p class="wordmark">Vitu</p>
      <p class="who">Vitor Wallaf volta para a Solar</p>
      <div class="clock" id="clock" aria-hidden="true">
        <p class="unit"><span class="num" id="days">0</span><span class="name">dias</span></p>
        <p class="unit"><span class="num" id="hours">0</span><span class="name">horas</span></p>
        <p class="unit"><span class="num" id="minutes">0</span><span class="name">minutos</span></p>
        <p class="unit"><span class="num" id="seconds">0</span><span class="name">segundos</span></p>
      </div>
      <h1 id="headline">Para o Vitu voltar</h1>
      <p class="live" id="live" aria-live="polite"></p>
      <p class="phrase" id="phrase"></p>
      <p class="when">Segunda-feira, 9 de novembro de 2026, 8h.</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
